<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="header">
        <h1>Welcome to the Course Registration System</h1>
    </header>

    <div class="container">
        <div class="card-register">

            <h2>Student Registration</h2>

            <form id="registerForm" action="{{ url_for('register') }}" method="POST">

                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="John"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            placeholder="Doe"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">University Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="john@university.edu"
                        required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" name="department" required>
                            <option value="">Select Department</option>
                            <option>CSE</option>
                            <option>AI</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>Mechanical</option>
                            <option>Civil</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="year_of_study">Year</label>
                        <select id="year_of_study" name="year_of_study" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <input
                        type="tel"
                        id="phone_number"
                        name="phone_number"
                        placeholder="+91 98765 43210"
                        pattern="[0-9]{10}">
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="section">Section</label>
                        <select id="section" name="section">
                            <option value="">Select</option>
                            <option>A</option>
                            <option>B</option>
                            <option>C</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 characters"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter password"
                        required>
                </div>

                <button type="submit" class="register-btn">
                    Register
                </button>

            </form>

            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </div>
    </div>
<script>
const registerForm = document.getElementById("registerForm");

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirm_password");

// ==========================
// Live Password Validation
// ==========================
password.addEventListener("input", function () {

    const passwordPattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#^()_\-+=])[A-Za-z\d@$!%*?&#^()_\-+=]{8,}$/;

    if (!passwordPattern.test(password.value)) {
        password.setCustomValidity(
            "Password must be at least 8 characters long and contain one uppercase letter, one lowercase letter, one number, and one special character."
        );
    } else {
        password.setCustomValidity("");
    }

    // Check confirm password whenever password changes
    if (confirmPassword.value !== "") {
        if (password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity("Passwords do not match.");
        } else {
            confirmPassword.setCustomValidity("");
        }
    }
});

// ==========================
// Live Confirm Password Check
// ==========================
confirmPassword.addEventListener("input", function () {

    if (password.value !== confirmPassword.value) {
        confirmPassword.setCustomValidity("Passwords do not match.");
    } else {
        confirmPassword.setCustomValidity("");
    }

});

// ==========================
// Form Validation
// ==========================
registerForm.addEventListener("submit", async function (event) {

    const firstName = document.getElementById("first_name").value.trim();
    const lastName = document.getElementById("last_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const department = document.getElementById("department").value;
    const year = document.getElementById("year_of_study").value;
    const phone = document.getElementById("phone_number").value.trim();
    const passwordValue = password.value;
    const confirmPasswordValue = confirmPassword.value;
    const section = document.getElementById("section").value;
    if (firstName.length < 2) {
        alert("First name must contain at least 2 characters.");
        event.preventDefault();
        return;
    }
    if (lastName.length < 2) {
        alert("Last name must contain at least 2 characters.");
        event.preventDefault();
        return;
    }
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        alert("Please enter a valid email address.");
        event.preventDefault();
        return;
    }

    if (department === "") {
        alert("Please select your department.");
        event.preventDefault();
        return;
    }

    if (year === "") {
        alert("Please select your year of study.");
        event.preventDefault();
        return;
    }

    if (phone !== "") {

        const phonePattern = /^[0-9]{10}$/;

        if (!phonePattern.test(phone)) {
            alert("Phone number must contain exactly 10 digits.");
            event.preventDefault();
            return;
        }
    }

    const passwordPattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#^()_\-+=])[A-Za-z\d@$!%*?&#^()_\-+=]{8,}$/;

    if (!passwordPattern.test(passwordValue)) {
        alert("Password must be at least 8 characters long and contain one uppercase letter, one lowercase letter, one number, and one special character.");
        event.preventDefault();
        return;
    }

    if (passwordValue !== confirmPasswordValue) {
        alert("Passwords do not match.");
        event.preventDefault();
        return;
    }

    event.preventDefault();

    const response = await fetch("/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            first_name: firstName,
            last_name: lastName,
            email: email,
            department: department,
            year_of_study: year,
            phone_number: phone,
            password: passwordValue,
            section: section
        })
    });

    const result = await response.json();

    if (result.success) {
        alert(result.message);
        window.location.href = result.redirect;
    } else {
        alert(result.message);
    }

});
</script>
</body>
</html>
